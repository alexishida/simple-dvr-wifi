name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, lint e testes (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalação limpa
        run: npm ci

      - name: Rebuild nativo para ABI Electron
        run: npm run rebuild:native

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Testes unitários e de integração
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test de segurança Electron
        run: npm run test:electron-security
