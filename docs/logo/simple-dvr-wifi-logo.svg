<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Simple DVR Wi-Fi logo</title>
  <desc id="desc">Rounded dark app icon with a cyan security camera, Wi-Fi signal, and red recording indicator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b23"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#58c4ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect x="52" y="52" width="920" height="920" rx="220" fill="url(#bg)"/>
  <rect x="74" y="74" width="876" height="876" rx="198" fill="none" stroke="#2d3743" stroke-width="10"/>

  <g filter="url(#soft)">
    <!-- Camera body -->
    <path d="M244 384
             Q244 326 302 326
             H590
             Q646 326 646 382
             V642
             Q646 698 590 698
             H302
             Q244 698 244 640 Z"
          fill="#101722" stroke="url(#cyan)" stroke-width="34" stroke-linejoin="round"/>

    <!-- Camera lens -->
    <circle cx="447" cy="512" r="104" fill="#0d1117" stroke="#58c4ff" stroke-width="30"/>
    <circle cx="447" cy="512" r="46" fill="#58c4ff" opacity="0.22"/>
    <circle cx="447" cy="512" r="18" fill="#7dd3fc"/>

    <!-- DVR / capture bracket motif -->
    <path d="M322 426 V390 H358 M572 598 V634 H536"
          fill="none" stroke="#7dd3fc" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- Camera / stream tail -->
    <path d="M646 432 L786 368 Q816 354 816 388 V636 Q816 670 786 656 L646 592 Z"
          fill="#152331" stroke="url(#cyan)" stroke-width="34" stroke-linejoin="round"/>
  </g>

  <!-- Wi-Fi arcs integrated into the camera -->
  <g fill="none" stroke="#7dd3fc" stroke-linecap="round">
    <path d="M654 264 Q744 186 834 264" stroke-width="30"/>
    <path d="M690 306 Q744 260 798 306" stroke-width="28"/>
  </g>
  <circle cx="744" cy="350" r="19" fill="#7dd3fc"/>

  <!-- Recording status -->
  <circle cx="290" cy="760" r="52" fill="#f85149"/>
  <circle cx="290" cy="760" r="72" fill="none" stroke="#f85149" stroke-width="12" opacity="0.18"/>
</svg>
